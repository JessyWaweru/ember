# Supabase's free plan pauses a project after about a week without activity.
# This makes one tiny read every two days so Ember's database never sleeps, even if you stop using the app for a while.
# Uses the same repo secrets as the iOS build. Run it by hand from the Actions tab to test.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */2 * *' # 06:17 UTC every other day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Row-level security returns no rows to an anonymous caller, but the query still runs, which counts as activity.
          status=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/habits?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $status"
          test "$status" = 200
